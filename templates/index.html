<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhi Ka Personal AI</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background-color: #1e1e1e; padding: 15px; text-align: center; font-weight: bold; border-bottom: 2px solid #333; color: #00ffcc; font-size: 20px; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 16px; border-radius: 10px; max-width: 75%; word-wrap: break-word; }
        .user-msg { background-color: #007bff; align-self: flex-end; }
        .ai-msg { background-color: #2a2a2a; align-self: flex-start; border: 1px solid #444; }
        .input-area { padding: 15px; background-color: #1e1e1e; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #444; background-color: #2c2c2c; color: white; outline: none; font-size: 16px; }
        button { background-color: #00ffcc; border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">🧠 ABHI KA PERSONAL AI</div>
    <div class="chat-box" id="chatBox">
        <div class="msg ai-msg">Ram Ram Bhai! Main aapka personal AI assistant hoon. Kuch bhi pucho! 🔥</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Apna sawaal yahan likho bhai..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if(!message) return;
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="msg user-msg">${message}</div>`;
            input.value = '';
            const loadingId = 'load-' + Date.now();
            chatBox.innerHTML += `<div class="msg ai-msg" id="${loadingId}">Typing...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
            try {
                const response = await fetch('/api/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                document.getElementById(loadingId).innerText = data.reply;
            } catch (error) {
                document.getElementById(loadingId).innerText = "Error: Connection error!";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
          </html>
